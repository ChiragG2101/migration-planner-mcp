# Runs the gates that need no model on every push and PR: typecheck, lint, the
# whole test suite (permissions included), the seeded recall ratchet, the eval
# replay, the build, and the spine and skills checks (docs/design.md D23). The
# only network step is the golden cases' pinned commits, fetched from their
# public repos by eval tooling and cached (D17).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Windows is not verified yet (the tests create symlinks, which need extra
    # privileges there), so its failures are reported but don't block.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22.13.0', experimental: false } # the engines floor (D18)
          - { os: ubuntu-latest, node: '22.x', experimental: false }
          - { os: macos-latest, node: '22.x', experimental: false }
          - { os: windows-latest, node: '22.x', experimental: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The recall ratchet compares eval/seeded/ratchet.json with the PR base or the previous push.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Lint
        env:
          # The pack lint compares the pack version with the PR base (or the previous push).
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run lint
      - run: npm test
      - name: Seeded recall ratchet (only moves up)
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run recall -- --check --base "$BASE_SHA"
      # The two eval-data checks run before the case-commit cache and fetch, so a
      # pack PR's case data is vetted before git is given it (D59). They read
      # only git refs, never eval/.work.
      - name: Eval add-only (existing cases and runs are add-only, D15)
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run eval:add-only -- --base "$BASE_SHA"
      - name: No core changes (pack PRs only; a core change needs its own PR, D15/INV-27)
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        # Self-skips on a core PR (nothing under packs/ or knowledge/). On a pack
        # PR it enforces the allowlist against the PR base.
        run: npm run check:core-untouched -- --base "$BASE_SHA"
      - name: Cache golden-case commits (D17)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: eval/.work
          key: case-commits-${{ runner.os }}-${{ hashFiles('eval/cases/*/case.json') }}
          restore-keys: case-commits-${{ runner.os }}-
      - name: Fetch golden-case commits (fails closed with case_commit_unavailable)
        shell: bash
        run: npm run cases:fetch
      # Smoke replays a golden case, so it needs the checkouts the fetch makes.
      - name: Eval smoke (replay, free; no model, no paid service)
        shell: bash
        run: npm run eval:smoke
      - name: Eval pack gate (replay, free; D17)
        shell: bash
        run: npm run eval:pack-gate
      - name: Eval results.md in step with HEAD's tree
        shell: bash
        run: npm run eval -- --tier all --check
      - run: npm run build
      - run: npm run build:packs -- --check
      - name: Spine and skills checks
        shell: bash
        run: |
          sh scripts/check-spine.sh
          sh scripts/check-agent-skills.sh
